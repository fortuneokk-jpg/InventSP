<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/jpeg" href="Smart_Parker_Logo.jpg">
<link rel="apple-touch-icon" href="Smart_Parker_Logo.jpg">
<title>InventorySP</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#F5F8F6;color:#12201B}
a{color:inherit;text-decoration:none}
.wrap{min-height:100vh;display:flex;flex-wrap:wrap}
aside{flex:0 0 248px;min-width:220px;background:#046A4E;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;font-size:20px;font-weight:800}
.tile{width:48px;height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile img{width:92%;height:92%;object-fit:contain}
nav{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:600}
nav a{padding:12px;border-radius:10px}
nav a:hover{background:#0A7C5D}
nav a.on{background:#fff;color:#046A4E}
.sep{height:1px;background:#2D8A71;margin:8px 0}
.me{margin-top:auto;padding:12px;border-radius:10px;background:#04503B;font-size:14px}
.me b{display:block;overflow-wrap:anywhere}.me span{color:#D3E8DF}
.me button{margin-top:10px;width:100%;height:40px;border:1px solid #6FB9A3;background:transparent;color:#fff;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
main{flex:1 1 640px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
h1{margin:0 0 4px;font-size:28px;font-weight:800;letter-spacing:-.5px}
.sub{margin:0;color:#4A5B54}
h2{margin:0;font-size:18px;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input,select,textarea{height:44px;padding:0 14px;font:inherit;font-size:15px;border:1.5px solid #B8C4BE;border-radius:10px;background:#fff;max-width:100%}
input:focus,select:focus{outline:3px solid #9ADBC4;border-color:#046A4E}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;flex:1 1 180px}
.btn{height:44px;padding:0 18px;border:0;border-radius:10px;background:#046A4E;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:#04503B}.btn:disabled{opacity:.6;cursor:wait}
.btn.alt{background:#fff;color:#046A4E;border:1.5px solid #046A4E}.btn.alt:hover{background:#F0F7F4}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.red{background:#B42318}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:#fff;border:1px solid #DCE5E0;border-radius:14px}
.pad{padding:20px;display:flex;flex-direction:column;gap:16px}
.qa{padding:18px;display:flex;flex-direction:column;gap:4px}.qa b{font-size:16px}.qa span{font-size:14px;color:#4A5B54}
.qa:hover{border-color:#046A4E;background:#F0F7F4}
.kpi{padding:20px}.kpi div:first-child{font-size:14px;color:#4A5B54;font-weight:600}.kpi div:last-child{font-size:36px;font-weight:800;margin-top:6px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{padding:12px 16px;text-align:left;font-size:12px;font-weight:700;color:#4A5B54;letter-spacing:.5px;text-transform:uppercase}
td{padding:12px 16px;border-top:1px solid #E6ECE8;font-size:14px;vertical-align:middle}
td input,td select{height:36px;font-size:14px;width:100%;min-width:90px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-ok{background:#E6F4EE;color:#04503B}.b-low{background:#FFF4E0;color:#9A5300}.b-out{background:#FDECEA;color:#B42318}.b-gray{background:#EDF0EE;color:#4A5B54}
.alert{display:flex;justify-content:space-between;gap:12px;padding:12px;border-radius:10px;font-size:14px}
.alert.out{background:#FDECEA;color:#B42318}.alert.low{background:#FFF4E0;color:#9A5300}.alert b{color:#12201B}.alert i{font-style:normal;font-weight:700;white-space:nowrap}
.empty{padding:16px;color:#4A5B54;font-size:14px}
#toast{position:fixed;right:20px;bottom:20px;max-width:360px;padding:14px 18px;border-radius:12px;color:#fff;font-weight:600;font-size:15px;display:none;z-index:9}
.lines{display:flex;flex-direction:column;gap:10px}
.sec{padding:18px 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.burger{display:none;width:44px;height:44px;border-radius:10px;border:1px solid #6FB9A3;background:transparent;color:#fff;font-size:22px;cursor:pointer;align-items:center;justify-content:center}
#drawer{display:flex;flex-direction:column;gap:24px;flex:1}
main>*{width:100%;max-width:1280px;margin-inline:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:0 14px;min-height:44px;border:1.5px solid #B8C4BE;border-radius:10px;background:#fff;font-weight:700;font-size:15px;cursor:pointer;user-select:none}
.chip input{width:18px;height:18px;min-width:0;accent-color:#046A4E}
.chip:has(input:checked){border-color:#046A4E;background:#E6F4EE}
@media(min-width:900px){aside{position:sticky;top:0;height:100vh;overflow-y:auto}}
@media(min-width:1400px){main{padding:40px 48px}}
@media(max-width:899px){
aside{flex:0 0 100%;min-width:0;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;gap:0;position:sticky;top:0;z-index:5}
aside.open{max-height:100vh;max-height:100dvh;overflow-y:auto}
.burger{display:inline-flex}
#drawer{display:none;padding:16px 0 calc(8px + env(safe-area-inset-bottom))}
aside.open #drawer{display:flex}
.tile{width:40px;height:40px;border-radius:10px}
nav a{padding:14px 12px}
main{flex:1 1 100%;padding:20px 16px calc(32px + env(safe-area-inset-bottom));gap:20px}
}
@media(max-width:640px){
h1{font-size:22px}h2{font-size:17px}
.head,.head .row{width:100%}
.head .row>*{flex:1 1 100%}
label.f{flex:1 1 100%}
.row>.btn{flex:1 1 auto}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{padding:16px}.kpi div:last-child{font-size:28px}
.qa{padding:14px}
.pad{padding:16px}
.lines .row>select{flex:1 1 100%}.lines .row>input{flex:1 1 90px}
.scroll{overflow:visible}
table{min-width:0;display:block}thead{display:none}tbody{display:block}
tr{display:block;padding:10px 16px;border-top:1px solid #E6ECE8}
td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:6px 0;text-align:right;overflow-wrap:anywhere}
td::before{content:attr(data-label);flex:0 0 38%;font-size:12px;font-weight:700;color:#4A5B54;text-transform:uppercase;letter-spacing:.5px;text-align:left}
td[data-label='']::before,td:not([data-label])::before{display:none}
td[data-label='']{justify-content:flex-end}
td input,td select{flex:1;width:auto;min-width:0;max-width:62%}
td input[type=checkbox]{flex:0 0 auto}
td.empty{display:block;text-align:left;padding:8px 0}
#toast{left:12px;right:12px;max-width:none;bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
/* compact searchable lists (devices + marshals) */
.ctools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 16px 12px}
.cq{flex:1 1 220px;max-width:340px;height:40px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fc{height:34px;padding:0 12px;border:1.5px solid #B8C4BE;border-radius:999px;background:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:#12201B}
.fc b{color:#4A5B54;font-weight:700;margin-left:2px}
.fc.on{background:#046A4E;border-color:#046A4E;color:#fff}.fc.on b{color:#D3E8DF}
.crow{display:flex;align-items:center;gap:6px 12px;padding:6px 16px;min-height:48px;border-top:1px solid #E6ECE8}
.crow:hover{background:#F7FAF8}
.c-main{flex:0 0 210px;display:flex;align-items:center;gap:8px;min-width:0}
.c-tag{font-weight:800;font-size:15px}
.c-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-meta{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:13px;color:#4A5B54}
.c-where{min-width:130px;color:#12201B;font-weight:600}
.c-ip{color:#4A5B54;font-size:13px}
a.c-ip{color:#046A4E;font-weight:600}
.c-act{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.pill{padding:1px 8px;border-radius:6px;background:#FFF4E0;color:#9A5300;font-weight:800;font-size:12px}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px 12px;border-top:1px solid #E6ECE8}
.clist .empty{border-top:1px solid #E6ECE8}
.addp{border-top:1px solid #E6ECE8}
.more{position:relative}
.more>summary{list-style:none;cursor:pointer;width:36px;height:36px;border:1.5px solid #046A4E;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#046A4E;font-weight:800;background:#fff;user-select:none}
.more>summary::-webkit-details-marker{display:none}
.more[open]>summary{background:#E6F4EE}
.more .menu{position:absolute;right:0;top:40px;z-index:6;background:#fff;border:1px solid #DCE5E0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:170px}
.btn.dg{color:#B42318;border-color:#B42318}.btn.dg:hover{background:#FDECEA}
@media(max-width:640px){.crow{flex-wrap:wrap;padding:8px 14px}.c-main{flex:1 1 auto}.c-act{order:2}.c-meta{order:3;flex:1 1 100%}.c-where{min-width:0}.cq{max-width:none;flex:1 1 100%}}
/* tabs, tiles, dense stats */
.strip{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:1 1 130px;display:flex;align-items:baseline;gap:8px;padding:8px 14px;background:#fff;border:1px solid #DCE5E0;border-radius:12px}
.stat b{font-size:22px;font-weight:800}.stat span{font-size:13px;color:#4A5B54;font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid #DCE5E0;margin-bottom:-8px}
.tab{padding:10px 14px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-weight:700;color:#4A5B54;cursor:pointer;white-space:nowrap}
.tab b{background:#EDF0EE;border-radius:999px;padding:1px 8px;font-size:12px;margin-left:4px}
.tab.on{color:#046A4E;border-bottom-color:#046A4E}.tab.on b{background:#E6F4EE}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:0 16px 12px}
.tiles .empty{grid-column:1/-1;border:0}
.tl{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 9px;border:1.5px solid;border-radius:10px;font:inherit;text-align:left;cursor:pointer;min-width:0}
.tl b{font-size:14px;font-weight:800}.tl span{font-size:11.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl.off{background:#E6F4EE;border-color:#9ADBC4;color:#04503B}
.tl.out{background:#FFF4E0;border-color:#F0C77A;color:#9A5300}
.tl.bad{background:#FDECEA;border-color:#F0A9A2;color:#B42318}
.tl.sel{outline:3px solid #046A4E;outline-offset:1px}
.det{padding:0 16px 12px}.det:empty{display:none}
.detin{border:1.5px solid #046A4E;border-radius:12px;background:#F7FAF8;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dettop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dettop .btn{margin-left:auto}
.two{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr))}
.two .c-main{flex:1 1 130px}.two .c-meta{flex:0 1 auto;max-width:55%}
.crow input[type=checkbox]{width:20px;height:20px;min-width:0;padding:0;accent-color:#046A4E;flex:none}
@media(max-width:640px){.two .c-meta{flex:1 1 100%;max-width:none}.tiles{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}.stat{flex:1 1 44%}}
</style>
</head>
<body>
<div class="wrap">
<aside>
<div class="top"><div class="brand"><div class="tile"><img src="Smart_Parker_Logo.jpg" alt="Smart Parker logo"></div>InventorySP</div><button id="burger" class="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">☰</button></div>
<div id="drawer"><nav id="nav" aria-label="Main"></nav>
<div class="me"><b id="uname">Loading…</b><span id="urole"></span><button id="out" type="button">Sign out</button></div></div>
</aside>
<main id="view"></main>
</div>
<div id="toast" role="status"></div>
<script>
const URL_='https://xstjznhcpungxhrjrvdq.supabase.co',KEY='sb_publishable_hkNdUICElgNZRd-hXHwgfw_WMgitNHU';
const S={db:null,p:null,sites:[],items:[]};
const V=document.getElementById('view');
const el=(t,p,...k)=>{const e=document.createElement(t);for(const [a,v] of Object.entries(p||{})){if(a==='class')e.className=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else if(a==='for')e.htmlFor=v;else if(a.startsWith('data-'))e.setAttribute(a,v);else if(v!==false&&v!=null)e[a]=v}for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e};
const fmt=d=>new Date(d).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const ok=r=>{if(r.error)throw r.error;return r.data};
const isMgr=()=>['admin','manager'].includes(S.p.role),isAdmin=()=>S.p.role==='admin';
let tt;function toast(m,bad){const t=document.getElementById('toast');t.textContent=m;t.style.background=bad?'#B42318':'#04503B';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4500)}
const fail=e=>toast((e&&e.message)||'Something went wrong',true);
function sel(opts,val,p){const s=el('select',p,opts.map(o=>el('option',{value:o.v},o.t)));if(val!=null)s.value=val;return s}
const siteOpts=(all)=>[...(all?[{v:'',t:'All sites'}]:[]),...S.sites.filter(s=>s.is_active).map(s=>({v:s.id,t:s.name}))];
const itemOpts=()=>S.items.filter(i=>i.is_active).map(i=>({v:i.id,t:i.sku+' – '+i.name}));
const field=(label,input)=>el('label',{class:'f'},label,input);
const head=(t,s,...a)=>el('div',{class:'head'},el('div',{},el('h1',{},t),el('p',{class:'sub'},s)),el('div',{class:'row'},a));
const tbl=(h,rows,empty)=>el('div',{class:'scroll'},el('table',{},el('thead',{},el('tr',{},h.map(x=>el('th',{},x)))),el('tbody',{},rows.length?rows.map(r=>el('tr',{},r.map((c,i)=>el('td',{'data-label':h[i]},c)))):el('tr',{},el('td',{colSpan:h.length,class:'empty'},empty||'Nothing here yet.')))));
const badge=(t,c)=>el('span',{class:'badge '+c},t);
const TYPES={receive:'Received',issue:'Issued',transfer_out:'Transfer out',transfer_in:'Transfer in',count_adjust:'Count adjusted'};
async function loadRef(){const [a,b]=await Promise.all([S.db.from('sites').select('*').order('name'),S.db.from('items').select('*').order('name')]);S.sites=ok(a);S.items=ok(b)}
function csv(name,head,rows){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const t=[head,...rows].map(r=>r.map(q).join(',')).join('\n');const a=el('a',{href:URL.createObjectURL(new Blob([t],{type:'text/csv'})),download:name});document.body.append(a);a.click();a.remove()}

/* ---------- HOME ---------- */
async function home(){
  const name=S.p.full_name||S.p.email.split('@')[0],h=new Date().getHours();
  const site=sel(siteOpts(true),S.p.site_id||'');
  const k=['Total items','Low stock','Out of stock','Transfers pending','Devices out'].map((t,i)=>el('div',{class:'card kpi'},el('div',{},t),el('div',{style:i==1?'color:#9A5300':i==2?'color:#B42318':''},'–')));
  const na=el('div',{class:'pad'}),mv=el('div',{});
  V.replaceChildren(
    head((h<12?'Good morning, ':h<18?'Good afternoon, ':'Good evening, ')+name,'Here is what is happening across your sites today.',site),
    el('section',{class:'grid'},[['Issue devices','Send handhelds out with marshals','#/devices'],['Receive stock','Add items coming in','#/stock'],['Issue stock','Record items going out','#/stock'],['New transfer','Move stock between sites','#/transfers'],['Start a count','Scan and reconcile','#/counts']].map(a=>el('a',{href:a[2],class:'card qa'},el('b',{},a[0]),el('span',{},a[1])))),
    el('section',{class:'grid'},k),
    el('div',{class:'cols'},el('section',{class:'card',style:'flex:2 1 520px;min-width:0'},el('div',{class:'sec'},el('h2',{},'Recent movements'),el('a',{href:'#/reports',style:'font-weight:700;color:#046A4E;font-size:14px'},'All reports')),mv),el('section',{class:'card',style:'flex:1 1 300px;min-width:0'},el('div',{class:'sec'},el('h2',{},'Needs attention')),na)));
  const load=async()=>{const s=site.value||null;
    const [a,b,c,dv]=await Promise.all([S.db.rpc('dashboard_summary',{p_site:s}),S.db.rpc('needs_attention',{p_site:s}),S.db.from('recent_movements').select('*').order('created_at',{ascending:false}).limit(8),S.db.from('device_status').select('device_id',{count:'exact',head:true}).eq('is_out',true)]);
    k[4].lastChild.textContent=dv.count??0;
    const r=ok(a)[0]||{};[r.total_items,r.low_stock,r.out_of_stock,r.transfers_pending].forEach((v,i)=>k[i].lastChild.textContent=v??0);
    const n=ok(b);na.replaceChildren(...(n.length?n.slice(0,6).map(i=>el('div',{class:'alert '+i.status},el('b',{},i.name),el('i',{},i.status==='out'?'Out of stock':'Low: '+i.quantity+' left'))):[el('div',{class:'empty'},'Nothing needs attention right now.')]));
    mv.replaceChildren(tbl(['Item','Type','Qty','Site','By','When'],ok(c).map(x=>[x.item_name,TYPES[x.type]||x.type,x.quantity,x.site_name,x.created_by_name||'',fmt(x.created_at)]),'No movements yet.'))};
  site.addEventListener('change',()=>load().catch(fail));load().catch(fail)}

/* ---------- INVENTORY ---------- */
async function inventory(){
  const rows=ok(await S.db.from('items').select('*, stock_levels(quantity)').order('name'));
  const q=el('input',{type:'search',placeholder:'Search name, SKU or barcode'}),form=el('div'),body=el('div');
  const status=(i,t)=>!i.is_active?badge('Inactive','b-gray'):t===0?badge('Out','b-out'):(i.reorder_level>0&&t<=i.reorder_level)?badge('Low','b-low'):badge('OK','b-ok');
  const draw=()=>{const f=q.value.toLowerCase();body.replaceChildren(tbl(['SKU','Name','Category','On hand','Unit','Reorder at','Status',''],rows.filter(i=>(i.name+i.sku+(i.barcode||'')).toLowerCase().includes(f)).map(i=>{const t=i.stock_levels.reduce((a,s)=>a+s.quantity,0);return[i.sku,i.name,i.category||'',String(t),i.unit,i.reorder_level,status(i,t),isMgr()?el('div',{class:'row'},el('button',{class:'btn alt sm',onclick:()=>edit(i)},'Edit'),el('button',{class:'btn red sm',onclick:()=>del(i)},'Delete')):'']}),'No items match.'))};
  const del=async i=>{if(!confirm('Delete "'+i.name+'" ('+i.sku+')? This cannot be undone.'))return;try{ok(await S.db.rpc('delete_item',{p_id:i.id,p_force:false}));toast('Item deleted');await loadRef();inventory()}catch(e){if((e.message||'')==='HAS_HISTORY'){if(!isAdmin()){toast('This item has stock history, so it cannot be deleted. Set its Status to Inactive instead.',true);return}if(!confirm('"'+i.name+'" has stock movements recorded. Deleting it will also permanently erase its stock history and levels. Delete anyway?'))return;try{ok(await S.db.rpc('delete_item',{p_id:i.id,p_force:true}));toast('Item and its history deleted');await loadRef();inventory()}catch(e2){fail(e2)}}else fail(e)}};
